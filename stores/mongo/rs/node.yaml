containers:
  - name: mongo
    image: 'mongo:{{ store_version }}'
    command:
      - 'mongod'
      - '--replSet'
      - '{{ cluster_id }}'
      - '--oplogSize'
      - '1024'
      - '--bind_ip'
      - '0.0.0.0'
    mount:
      - type: bind
        src: '{{ "{{" }} DATA_ROOT }}/db'
        target: '/data/db'
        relabel: private

  - name: repliagent
    image: localhost/repliagent/mongo:local
    command:
      - '/opt/replicante/bin/repliagent-mongodb'
      - '--config=/conf/agent-mongodb.yaml'
      - 'replica-set'
    env:
      RA_NODE_ID: '{{ "{{" }} NODE_NAME }}'
      RA_NODE_ADDR_MEMBER: 'host.containers.internal:{{ "{{" }} HOST_PORT_STORE }}'
    mount:
      - type: bind
        src: '{{ "{{" }} CONF_ROOT }}/'
        target: '/conf'
        relabel: shared
        ro: 'true'
      - type: bind
        src: '{{ "{{" }} DATA_ROOT }}/agent'
        target: '/data'
        relabel: private
        uid: 1616
    workdir: '/opt/replicante'

ports:
  - host: 0
    name: 'store'
    pod: 27017
  - host: 0
    name: 'agent'
    pod: 37017
